name: PCB CI

on:
  push:
    branches:
      - main
    paths:
      - "pcb/**"
      - "libraries/**"
      - "tools/crimpdeq/**"
      - ".github/scripts/**"
      - ".github/workflows/pcb_ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "pcb/**"
      - "libraries/**"
      - "tools/crimpdeq/**"
      - ".github/scripts/**"
      - ".github/workflows/pcb_ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Test validation tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test validation failures and report handling
        run: python3 -m unittest discover -s tools/crimpdeq/tests -v

  pcb:
    name: Check PCB
    runs-on: ubuntu-latest
    needs: tooling
    env:
      PCB_FILE: pcb/crimpdeq/crimpdeq.kicad_pcb
      SCH_FILE: pcb/crimpdeq/crimpdeq.kicad_sch

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare output folders
        run: |
          mkdir -p artifacts reports
          # Match the release workflow: the KiCad image runs as a different user.
          chmod a+w reports

      - name: Validate schematic, PCB, and design invariants
        uses: docker://kicad/kicad:10.0
        with:
          entrypoint: python3
          args: tools/crimpdeq/check.py

      - name: Export schematic and layout PDFs
        uses: actions-for-kicad/kicad-actions@v2-k10.0
        with:
          schematic_file_name: ${{ env.SCH_FILE }}
          schematic_output_pdf: true
          schematic_output_pdf_file_name: artifacts/schematic.pdf

          pcb_file_name: ${{ env.PCB_FILE }}
          pcb_output_pdf: true
          pcb_output_pdf_file_name: artifacts/layout.pdf
          pcb_output_layers: F.Cu,In1.Cu,In2.Cu,B.Cu,F.Silkscreen,B.Silkscreen,Edge.Cuts

      - name: Upload schematic PDF
        if: always()
        id: upload_schematic
        uses: actions/upload-artifact@v6
        with:
          name: pcb-schematic-pdf
          path: artifacts/schematic.pdf
          if-no-files-found: warn

      - name: Upload layout PDF
        if: always()
        id: upload_layout
        uses: actions/upload-artifact@v6
        with:
          name: pcb-layout-pdf
          path: artifacts/layout.pdf
          if-no-files-found: warn

      - name: Upload validation reports and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pcb-validation-reports
          path: reports/
          if-no-files-found: error

      - name: Write action summary
        if: always()
        env:
          SCHEMATIC_ARTIFACT_URL: ${{ steps.upload_schematic.outputs.artifact-url }}
          LAYOUT_ARTIFACT_URL: ${{ steps.upload_layout.outputs.artifact-url }}
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PCB validation did not produce a summary; see the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SCHEMATIC_ARTIFACT_URL" ]; then
            echo "- [Schematic PDF]($SCHEMATIC_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$LAYOUT_ARTIFACT_URL" ]; then
            echo "- [Layout PDF]($LAYOUT_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
